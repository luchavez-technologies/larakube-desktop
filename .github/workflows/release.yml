name: release

# develop  → canary prerelease under the moving `canary` tag (replaced each push)
# v* tag   → stable release (e.g. v0.0.1), immutable
# Mirrors the LaraKube CLI's release flow.
on:
  push:
    branches:
      - develop
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.target.outputs.version }}
      tag: ${{ steps.target.outputs.tag }}
      is_canary: ${{ steps.target.outputs.is_canary }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup application
        run: composer setup

      - name: Tests, lint and types
        run: composer ci:check

      # electron-builder needs SemVer: stable = the tag without "v", canary =
      # a prerelease of the next patch so it never outranks a real release.
      - name: Release target
        id: target
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "is_canary=false" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.1-canary.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "tag=canary" >> "$GITHUB_OUTPUT"
            echo "is_canary=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: mac, arch: arm64 }
          - { os: macos-latest, target: mac, arch: x64 }
          - { os: windows-latest, target: win, arch: x64 }
          # Linux builds are paused while Windows and macOS are the focus; restore this line to ship them again.
          # - { os: ubuntu-latest, target: linux, arch: x64 }
    runs-on: ${{ matrix.os }}
    env:
      NATIVEPHP_APP_VERSION: ${{ needs.checks.outputs.version }}
      # The updater reads latest.yml from the release assets. macOS only updates signed apps, so it stays
      # off there until plan 04 lands.
      NATIVEPHP_UPDATER_ENABLED: ${{ matrix.target != 'mac' && 'true' || 'false' }}
      NATIVEPHP_UPDATER_PROVIDER: github
      GITHUB_OWNER: ${{ github.repository_owner }}
      GITHUB_REPO: ${{ github.event.repository.name }}
      LARAKUBE_UPDATE_URL: ${{ needs.checks.outputs.is_canary == 'true' && format('https://github.com/{0}/releases/download/canary', github.repository) || format('https://github.com/{0}/releases/latest/download', github.repository) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Windows runners' PHP ships without fileinfo and zip, which
      # nativephp/desktop and league/flysystem require; list the set explicitly.
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
          extensions: fileinfo, zip, mbstring, openssl, curl, pdo_sqlite, sqlite3

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install dependencies
        shell: bash
        run: |
          composer install --no-interaction --prefer-dist
          cp .env.example .env
          php artisan key:generate
          echo "NATIVEPHP_APP_VERSION=${NATIVEPHP_APP_VERSION}" >> .env
          echo "NATIVEPHP_UPDATER_ENABLED=${NATIVEPHP_UPDATER_ENABLED}" >> .env
          npm ci

      # #plugin in nativephp/electron resolves to electron-plugin/dist, a
      # gitignored build output that native:install makes locally, so a fresh
      # checkout has to compile it before native:build.
      - name: Build the Electron plugin
        shell: bash
        working-directory: nativephp/electron
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run plugin:build
          test -f electron-plugin/dist/index.js

      # electron-vite bakes this into the main process at build time. The file is gitignored
      # (native:install writes it locally), so without it the packaged app starts with
      # path.resolve(..., undefined) and crashes.
      - name: Set the packaged build path
        shell: bash
        run: echo "MAIN_VITE_NATIVEPHP_BUILD_PATH='../../../build'" > nativephp/electron/.env.production

      - name: Build ${{ matrix.target }}-${{ matrix.arch }}
        shell: bash
        run: php artisan native:build ${{ matrix.target }} ${{ matrix.arch }} --no-interaction

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p out
          find nativephp/electron/dist -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.AppImage' -o -name '*.deb' \) -exec cp {} out/ \;
          # The updater's feed files. Not latest-mac.yml: both macOS builds would write the same name.
          find nativephp/electron/dist -maxdepth 1 -type f \( -name 'latest.yml' -o -name 'latest-linux.yml' \) -exec cp {} out/ \;
          # Fixed names beside the versioned ones, so the docs can link to
          # releases/latest/download/<name> and releases/download/canary/<name>
          # without asking the GitHub API (which rate-limits shared networks).
          cd out
          for f in *.dmg; do
            [ -e "$f" ] || continue
            case "$f" in
              *arm64*) cp "$f" LaraKube-Desktop-mac-arm64.dmg ;;
              *x64*) cp "$f" LaraKube-Desktop-mac-x64.dmg ;;
            esac
          done
          for f in *.exe; do [ -e "$f" ] && cp "$f" LaraKube-Desktop-windows-x64-setup.exe; done
          for f in *.AppImage; do [ -e "$f" ] && cp "$f" LaraKube-Desktop-linux-x64.AppImage; done
          for f in *.deb; do [ -e "$f" ] && cp "$f" LaraKube-Desktop-linux-x64.deb; done
          cd ..
          ls -la out
          test -n "$(ls -A out)"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: larakube-desktop-${{ matrix.target }}-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

  publish:
    needs: [checks, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      # Canary re-points its moving tag and updates its one release in place; a v* release is created once and never moved.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.checks.outputs.tag }}
          VERSION: ${{ needs.checks.outputs.version }}
          IS_CANARY: ${{ needs.checks.outputs.is_canary }}
        run: |
          set -e
          printf 'LaraKube Desktop %s\n\nUnsigned build: on macOS, right-click the app and choose Open the first time (or run `xattr -dr com.apple.quarantine "/Applications/LaraKube Desktop.app"`). On Windows, choose More info → Run anyway.\n' "$VERSION" > notes.md
          if [ "$IS_CANARY" = "true" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag -f "$TAG" "$GITHUB_SHA"
            git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/$TAG"
            TITLE="Canary $VERSION ($(git rev-parse --short "$GITHUB_SHA"))"
            if gh release view "$TAG" >/dev/null 2>&1; then
              # Replaced in place, never deleted: installed apps read latest.yml from this release, and a release that is
              # briefly missing makes their update check or download fail. The installers go up first and the feed files
              # last, so the feed never names a file that is not there yet.
              gh release edit "$TAG" --title "$TITLE" --notes-file notes.md --prerelease
              find artifacts -maxdepth 1 -type f ! -name 'latest*.yml' -exec gh release upload "$TAG" {} --clobber \;
              find artifacts -maxdepth 1 -type f -name 'latest*.yml' -exec gh release upload "$TAG" {} --clobber \;
              # Then the files of earlier builds that this one no longer has.
              for name in $(gh release view "$TAG" --json assets --jq '.assets[].name'); do
                [ -e "artifacts/$name" ] || gh release delete-asset "$TAG" "$name" --yes
              done
            else
              gh release create "$TAG" artifacts/* --title "$TITLE" --notes-file notes.md --prerelease
            fi
          else
            gh release create "$TAG" artifacts/* --title "LaraKube Desktop $TAG" --notes-file notes.md
          fi
