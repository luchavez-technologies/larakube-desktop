name: rootfs

# The LaraKube WSL distro that Desktop imports on Windows (see plans/active/10-windows-installer-with-wsl.md).
# rootfs/** on develop → rebuilt and published as the `rootfs-canary` prerelease.
# manual              → any CLI release (canary, or a tag such as v0.34.0), for a stable rootfs.
on:
  push:
    branches:
      - develop
    paths:
      - 'rootfs/**'
      - '.github/workflows/rootfs.yml'
  workflow_dispatch:
    inputs:
      larakube_release:
        description: 'LaraKube CLI release to put in the rootfs (canary or a tag such as v0.34.0)'
        default: canary
      publish_tag:
        description: 'Release tag to publish under'
        default: rootfs-canary

permissions:
  contents: write

concurrency:
  group: rootfs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LARAKUBE_RELEASE: ${{ inputs.larakube_release || 'canary' }}
      PUBLISH_TAG: ${{ inputs.publish_tag || 'rootfs-canary' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the root filesystem (amd64)
        run: rootfs/build.sh "$LARAKUBE_RELEASE" linux/amd64

      - name: Check it the way Windows will use it
        run: rootfs/smoke.sh "dist/larakube-rootfs-${LARAKUBE_RELEASE}-amd64.tar.gz" linux/amd64

      - name: Size and checksum
        run: |
          ls -lh dist
          cat dist/*.sha256

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: larakube-rootfs
          path: dist/*

      - name: Publish
        if: github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$PUBLISH_TAG" >/dev/null 2>&1 \
            || gh release create "$PUBLISH_TAG" --prerelease --title "LaraKube WSL root filesystem ($PUBLISH_TAG)" \
                 --notes "The Linux system Desktop imports as the LaraKube WSL distro on Windows. Not for manual download."
          gh release upload "$PUBLISH_TAG" dist/* --clobber
